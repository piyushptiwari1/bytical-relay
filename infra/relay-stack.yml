AWSTemplateFormatVersion: "2010-09-09"
Description: >
  rdc-relay: zero-knowledge websocket relay for Relay by Bytical (S7).
  Fully isolated stack — own VPC, no dependencies on other resources in the
  account. All resources are rdc-prefixed. Teardown: delete this stack.

Parameters:
  RelayToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Controller-only relay credential and signed phone-ticket secret
  AnalyticsToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Bearer token for the first-party analytics owner endpoints
  RelayPort:
    Type: Number
    Default: 8443
  InstanceType:
    Type: String
    Default: t3.micro
  AzIndex:
    Type: Number
    Default: 1
    AllowedValues: [0, 1, 2]
    Description: Which AZ in the region to use (capacity varies per AZ)
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-08188a5a4dfdbd573
    Description: >
      PINNED so routine deploys never replace the instance (latest-AL2023 SSM
      lookups caused silent replacements on 09-04 and 09-12, wiping local
      state). Bump deliberately for OS refreshes — replacement is safe now
      (analytics DB restores from S3), but it still drops live connections.

Resources:
  RdcVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: rdc-relay-vpc }]

  RdcInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: rdc-relay-igw }]

  RdcVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RdcVpc
      InternetGatewayId: !Ref RdcInternetGateway

  RdcPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RdcVpc
      CidrBlock: 10.99.0.0/25
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [!Ref AzIndex, !GetAZs ""]
      Tags: [{ Key: Name, Value: rdc-relay-subnet }]

  RdcRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RdcVpc
      Tags: [{ Key: Name, Value: rdc-relay-rt }]

  RdcDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: RdcVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref RdcRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref RdcInternetGateway

  RdcSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RdcPublicSubnet
      RouteTableId: !Ref RdcRouteTable

  RdcRelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: rdc-relay ingress (websocket tunnel only)
      VpcId: !Ref RdcVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: rdc-relay-sg }]

  RdcArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub rdc-relay-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RdcInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rdc-relay-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: rdc-relay-artifacts-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${RdcArtifactsBucket.Arn}/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${RdcArtifactsBucket.Arn}/analytics.db.bak

  RdcInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: rdc-relay-instance-profile
      Roles: [!Ref RdcInstanceRole]

  RdcRelayInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref RdcPublicSubnet
      SecurityGroupIds: [!Ref RdcRelaySecurityGroup]
      IamInstanceProfile: !Ref RdcInstanceProfile
      Tags: [{ Key: Name, Value: rdc-relay }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          dnf install -y nodejs22 || dnf install -y nodejs20
          dnf install -y sqlite
          mkdir -p /opt/rdc
          cat > /etc/rdc-relay.env <<EOF
          RELAY_TOKEN=${RelayToken}
          RELAY_PORT=${RelayPort}
          EOF
          chmod 600 /etc/rdc-relay.env
          cat > /etc/systemd/system/rdc-relay.service <<'EOF'
          [Unit]
          Description=rdc zero-knowledge relay
          After=network-online.target
          StartLimitIntervalSec=0

          [Service]
          EnvironmentFile=/etc/rdc-relay.env
          ExecStartPre=/usr/bin/aws s3 cp s3://${RdcArtifactsBucket}/relay.mjs /opt/rdc/relay.mjs
          ExecStart=/usr/bin/env node /opt/rdc/relay.mjs
          Restart=always
          RestartSec=10
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF
          # ---- first-party analytics (feedback + field diagnostics) ----
          cat > /etc/rdc-analytics.env <<EOF
          ANALYTICS_TOKEN=${AnalyticsToken}
          ANALYTICS_PORT=8444
          ANALYTICS_DB=/opt/rdc/analytics.db
          EOF
          chmod 600 /etc/rdc-analytics.env
          # fresh instance: restore feedback/diag history from the last backup
          if [ ! -f /opt/rdc/analytics.db ]; then
            aws s3 cp s3://${RdcArtifactsBucket}/analytics.db.bak /opt/rdc/analytics.db || true
          fi
          cat > /etc/systemd/system/rdc-analytics.service <<'EOF'
          [Unit]
          Description=rdc-analytics first-party product analytics
          After=network-online.target
          StartLimitIntervalSec=0

          [Service]
          EnvironmentFile=/etc/rdc-analytics.env
          ExecStartPre=/usr/bin/aws s3 cp s3://${RdcArtifactsBucket}/analytics.mjs /opt/rdc/analytics.mjs
          ExecStart=/usr/bin/env node /opt/rdc/analytics.mjs
          Restart=always
          RestartSec=10
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF
          cat > /usr/local/bin/rdc-analytics-backup.sh <<'EOF'
          #!/bin/bash
          set -e
          [ -f /opt/rdc/analytics.db ] || exit 0
          sqlite3 /opt/rdc/analytics.db ".backup /tmp/analytics.db.bak"
          aws s3 cp /tmp/analytics.db.bak s3://${RdcArtifactsBucket}/analytics.db.bak
          EOF
          chmod +x /usr/local/bin/rdc-analytics-backup.sh
          cat > /etc/systemd/system/rdc-analytics-backup.service <<'EOF'
          [Unit]
          Description=backup rdc analytics db to s3

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/rdc-analytics-backup.sh
          EOF
          cat > /etc/systemd/system/rdc-analytics-backup.timer <<'EOF'
          [Unit]
          Description=periodic rdc analytics db backup

          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=6h

          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now rdc-relay
          systemctl enable --now rdc-analytics
          systemctl enable --now rdc-analytics-backup.timer
          # TLS termination: caddy proxies wss://ws.relay.bytical.ai -> :${RelayPort}
          curl -sL -o /usr/local/bin/caddy "https://caddyserver.com/api/download?os=linux&arch=amd64"
          chmod +x /usr/local/bin/caddy
          mkdir -p /etc/caddy
          cat > /etc/caddy/Caddyfile <<EOF
          ws.relay.bytical.ai {
            handle_path /a/* {
              reverse_proxy 127.0.0.1:8444
            }
            handle {
              reverse_proxy 127.0.0.1:${RelayPort}
            }
          }
          EOF
          cat > /etc/systemd/system/caddy.service <<'EOF'
          [Unit]
          Description=Caddy TLS proxy for rdc relay
          After=network-online.target
          StartLimitIntervalSec=0

          [Service]
          ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
          Restart=always
          RestartSec=10
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now caddy

  RdcRelayEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref RdcRelayInstance
      Tags: [{ Key: Name, Value: rdc-relay-eip }]

Outputs:
  RelayEndpoint:
    Value: !Sub ws://${RdcRelayEip.PublicIp}:${RelayPort}
  RelayPublicIp:
    Value: !GetAtt RdcRelayEip.PublicIp
  InstanceId:
    Value: !Ref RdcRelayInstance
  ArtifactsBucket:
    Value: !Ref RdcArtifactsBucket
