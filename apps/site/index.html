  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Relay keeps VS Code, GitHub Copilot sessions, Git, and terminals on your own machine within reach from your phone. Local-first, end-to-end encrypted, open source. Download the Android alpha."
    />
    <link rel="canonical" href="https://relay.bytical.ai/" />
    <meta name="theme-color" content="#0d1712" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relay by Bytical" />
    <meta property="og:title" content="Relay — your development work, within reach" />
    <meta
      property="og:description"
      content="Follow and steer the AI coding agents on your own dev machine from your phone. Local-first, E2EE, open source."
    />
    <meta property="og:url" content="https://relay.bytical.ai/" />
    <meta property="og:image" content="https://relay.bytical.ai/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Relay by Bytical — your dev machine, within reach" />
    <meta
      name="twitter:description"
      content="Supervise Copilot sessions, approve guarded steps, review Git — from your phone. Local-first and open source."
    />
    <meta name="twitter:image" content="https://relay.bytical.ai/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Relay by Bytical",
        "operatingSystem": "Android",
        "applicationCategory": "DeveloperApplication",
        "description": "Control your development machine and local AI coding agents from your phone. Local-first, end-to-end encrypted, open source.",
        "url": "https://relay.bytical.ai",
        "downloadUrl": "https://github.com/piyushptiwari1/bytical-relay/releases/latest",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "Bytical", "url": "https://bytical.ai" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // First-party, cookieless beacon — our own rdc-analytics service, no third parties.
      (() => {
        if (/bot|crawl|spider/i.test(navigator.userAgent)) return;
        var endpoint = "https://ws.relay.bytical.ai/a/collect";
        var send = (payload) => {
          try {
            fetch(endpoint, {
              method: "POST",
              keepalive: true,
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            }).catch(() => {});
          } catch (e) {}
        };
        send({ kind: "pageview", path: location.pathname, referrer: document.referrer });
        document.addEventListener("click", (event) => {
          var link = event.target && event.target.closest ? event.target.closest("a[data-track]") : null;
          if (link) send({ kind: "download", path: location.pathname, detail: link.getAttribute("data-track") });
        });
      })();
    </script>
  </body>
</html>
