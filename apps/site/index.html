<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relay by Bytical keeps your local coding agents, VS Code workspace, and developer machine within reach from your phone."
    />
    <meta name="theme-color" content="#0d1712" />
    <title>Relay by Bytical - Your development work, within reach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // First-party, cookieless beacon — our own rdc-analytics service, no third parties.
      (() => {
        if (/bot|crawl|spider/i.test(navigator.userAgent)) return;
        var endpoint = "https://ws.relay.bytical.ai/a/collect";
        var send = (payload) => {
          try {
            fetch(endpoint, {
              method: "POST",
              keepalive: true,
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            }).catch(() => {});
          } catch (e) {}
        };
        send({ kind: "pageview", path: location.pathname, referrer: document.referrer });
        document.addEventListener("click", (event) => {
          var link = event.target && event.target.closest ? event.target.closest("a[data-track]") : null;
          if (link) send({ kind: "download", path: location.pathname, detail: link.getAttribute("data-track") });
        });
      })();
    </script>
  </body>
</html>
