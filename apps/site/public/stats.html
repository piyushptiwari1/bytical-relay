<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Live, transparent usage statistics for Relay by Bytical — first-party, cookieless, aggregate-only." />
<title>Relay by Bytical — live stats</title>
<style>
  :root { --bg:#0d1414; --panel:#121c1c; --line:#1e2b2b; --ink:#e8f1ef; --dim:#7d938f; --accent:#4fd1b0; --blue:#6aa9e0; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif; padding:34px clamp(16px,5vw,60px); }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { font-size:20px; font-weight:650; } h1 b { color:var(--accent); }
  .pill { padding:2px 12px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--accent); border-color:rgba(79,209,176,.4); }
  .pill.bad { color:#e07a6a; border-color:rgba(224,122,106,.4); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:28px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:22px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .kpi .v { font-size:28px; font-weight:700; } .kpi .l { color:var(--dim); font-size:12px; }
  .row { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.8px; margin-bottom:14px; }
  svg text { fill:var(--dim); font-size:10px; }
  .bar-row { display:grid; grid-template-columns:60px 1fr 46px; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
  .bar-track { background:var(--line); border-radius:6px; height:10px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); border-radius:6px; }
  .n { text-align:right; font-variant-numeric:tabular-nums; }
  footer { color:var(--dim); font-size:12px; margin-top:26px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <header>
    <h1><b>Relay</b> live stats</h1>
    <span class="pill" id="relayPill">checking…</span>
  </header>
  <p class="sub">Transparent, first-party, cookieless numbers — collected by our own service, aggregate-only. <span id="meta"></span></p>
  <div class="grid" id="kpis"></div>
  <div class="row">
    <div class="card"><h2>Visits · last 30 days</h2><div id="trend"></div></div>
    <div class="card"><h2>Visitors by country</h2><div id="countries"></div></div>
  </div>
  <footer><a href="/">← relay.bytical.ai</a> · Relay is a product of Bytical · <a href="https://github.com/piyushptiwari1/bytical-relay">source</a></footer>
<script>
const fmt = (n) => Number(n ?? 0).toLocaleString();
async function load() {
  const response = await fetch("https://ws.relay.bytical.ai/a/public");
  const s = await response.json();
  const pill = document.getElementById("relayPill");
  pill.textContent = s.relay_online ? "relay service online" : "relay service offline";
  pill.className = "pill " + (s.relay_online ? "ok" : "bad");
  document.getElementById("meta").textContent = "Updated " + new Date(s.generated_at).toLocaleString();
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><div class="v">${fmt(s.totals.pageviews)}</div><div class="l">site visits</div></div>` +
    `<div class="kpi"><div class="v">${fmt(s.totals.downloads)}</div><div class="l">downloads</div></div>` +
    `<div class="kpi"><div class="v">${fmt((s.per_day.at(-1) || {}).visitors)}</div><div class="l">visitors today</div></div>`;
  const days = [...Array(30)].map((_, i) => new Date(Date.now() - (29 - i) * 864e5).toISOString().slice(0, 10));
  const byDay = Object.fromEntries(s.per_day.map((r) => [r.day, r.views]));
  const values = days.map((d) => byDay[d] ?? 0);
  const max = Math.max(1, ...values);
  const W = 560, H = 150, P = 8;
  const x = (i) => P + (i * (W - 2 * P)) / 29;
  const y = (v) => H - P - (v / max) * (H - 2 * P - 16);
  const path = values.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");
  document.getElementById("trend").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none">
      <path d="${path} L${x(29)},${H - P} L${x(0)},${H - P} Z" fill="#4fd1b0" opacity=".12"/>
      <path d="${path}" fill="none" stroke="#4fd1b0" stroke-width="2"/>
      <text x="${P}" y="${H - 1}">${days[0].slice(5)}</text><text x="${W - 40}" y="${H - 1}">${days[29].slice(5)}</text>
      <text x="${P}" y="12">max ${fmt(max)}/day</text>
    </svg>`;
  const cmax = Math.max(1, ...s.by_country.map((c) => c.n));
  document.getElementById("countries").innerHTML = s.by_country.length
    ? s.by_country.map((c) =>
        `<div class="bar-row"><span>${c.country}</span>
         <div class="bar-track"><div class="bar-fill" style="width:${(c.n / cmax) * 100}%"></div></div>
         <span class="n">${fmt(c.n)}</span></div>`).join("")
    : '<span class="sub">no data yet</span>';
}
load().catch(() => { document.getElementById("relayPill").textContent = "stats unavailable"; });
</script>
</body>
</html>
