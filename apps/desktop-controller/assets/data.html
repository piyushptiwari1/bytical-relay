<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Relay — data console</title>
<style>
  :root {
    --bg: #0d1414; --panel: #121c1c; --line: #1e2b2b; --ink: #e8f1ef;
    --dim: #7d938f; --accent: #4fd1b0; --warn: #e0b35c; --bad: #e07a6a;
    --chart1: #4fd1b0; --chart2: #6aa9e0; --chart3: #e0b35c; --chart4: #b78ae0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 28px clamp(16px, 4vw, 48px); }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 650; letter-spacing: .2px; }
  h1 .brand { color: var(--accent); }
  .meta { color: var(--dim); font-size: 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 22px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .kpi .l { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 14px; }
  svg text { fill: var(--dim); font-size: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 46px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .bar-row .name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--line); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--chart1); }
  .n { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  footer { color: var(--dim); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1><span class="brand">Relay</span> data console</h1>
    <span class="meta" id="meta">loading…</span>
  </header>
  <div class="grid" id="kpis"></div>
  <div class="row">
    <div class="card"><h2>Agent sessions · last 14 days</h2><div id="sessionsChart"></div></div>
    <div class="card"><h2>Events journaled · last 14 days</h2><div id="eventsChart"></div></div>
    <div class="card"><h2>Audit entries · last 14 days</h2><div id="auditChart"></div></div>
  </div>
  <div class="row">
    <div class="card"><h2>Sessions by status</h2><div id="statusBars"></div></div>
    <div class="card"><h2>Events by domain</h2><div id="domainBars"></div></div>
    <div class="card"><h2>Audit by action</h2><div id="actionBars"></div></div>
  </div>
  <div class="row">
    <div class="card" style="grid-column: 1 / -1;"><h2>Paired devices</h2><div id="deviceTable"></div></div>
  </div>
  <footer>Local-only console. Data never leaves this machine. Auto-refreshes every 60s.</footer>
<script>
const fmt = (n) => Number(n ?? 0).toLocaleString();

function kpi(value, label) {
  return `<div class="kpi"><div class="v">${value}</div><div class="l">${label}</div></div>`;
}

function barList(el, rows, key, color) {
  const max = Math.max(1, ...rows.map((r) => r.n));
  document.getElementById(el).innerHTML = rows.length
    ? rows.map((r) =>
        `<div class="bar-row"><span class="name" title="${r[key]}">${r[key]}</span>
         <div class="bar-track"><div class="bar-fill" style="width:${(r.n / max) * 100}%;background:${color}"></div></div>
         <span class="n">${fmt(r.n)}</span></div>`).join("")
    : '<span class="meta">no data yet</span>';
}

function lineChart(el, rows, color) {
  const days = [...Array(14)].map((_, i) => {
    const d = new Date(Date.now() - (13 - i) * 864e5);
    return d.toISOString().slice(0, 10);
  });
  const byDay = Object.fromEntries(rows.map((r) => [r.day, r.n]));
  const values = days.map((d) => byDay[d] ?? 0);
  const max = Math.max(1, ...values);
  const W = 340, H = 120, P = 6;
  const x = (i) => P + (i * (W - 2 * P)) / 13;
  const y = (v) => H - P - (v / max) * (H - 2 * P - 14);
  const path = values.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");
  const area = `${path} L${x(13)},${H - P} L${x(0)},${H - P} Z`;
  document.getElementById(el).innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none">
      <path d="${area}" fill="${color}" opacity="0.12"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="${color}"/>`).join("")}
      <text x="${P}" y="${H - 1}">${days[0].slice(5)}</text>
      <text x="${W - 34}" y="${H - 1}">${days[13].slice(5)}</text>
      <text x="${P}" y="12">max ${fmt(max)}</text>
    </svg>`;
}

function deviceTable(devices) {
  const rows = devices.map((d) => {
    const scopes = Array.isArray(d.scopes) ? d.scopes.join(", ") : String(d.scopes);
    const state = d.revoked ? '<span class="pill bad">revoked</span>'
      : Number(d.expires_at) < Date.now() ? '<span class="pill bad">expired</span>'
      : '<span class="pill ok">active</span>';
    const seen = d.last_seen_at ? new Date(d.last_seen_at).toLocaleString() : "never";
    return `<tr><td>${d.name}</td><td>${state}</td><td>${d.last_transport ?? "—"}</td>
            <td>${seen}</td><td class="meta" title="${scopes}">${scopes.slice(0, 60)}</td></tr>`;
  }).join("");
  document.getElementById("deviceTable").innerHTML =
    `<table><thead><tr><th>Device</th><th>State</th><th>Transport</th><th>Last seen</th><th>Scopes</th></tr></thead>
     <tbody>${rows || '<tr><td colspan="5" class="meta">no paired devices</td></tr>'}</tbody></table>`;
}

async function refresh() {
  const response = await fetch("/api/data/stats", { credentials: "same-origin" });
  if (response.status === 401) { location.href = "/data"; return; }
  const s = await response.json();
  document.getElementById("meta").textContent =
    `generated ${new Date(s.generated_at).toLocaleTimeString()} · controller up ${Math.floor(s.uptime_s / 60)}m`;
  document.getElementById("kpis").innerHTML = [
    kpi(fmt(s.sessions.total), "agent sessions"),
    kpi(fmt(s.sessions.queued), "queued prompts"),
    kpi(`${fmt(s.devices.active)} / ${fmt(s.devices.total)}`, "active devices"),
    kpi(fmt(s.devices.push_tokens), "push registrations"),
    kpi(fmt(s.events.total), "events journaled"),
    kpi(fmt(s.audit.total), "audit entries"),
  ].join("");
  lineChart("sessionsChart", s.sessions.per_day ?? [], getComputedStyle(document.body).getPropertyValue("--chart1"));
  lineChart("eventsChart", s.events.per_day ?? [], getComputedStyle(document.body).getPropertyValue("--chart2"));
  lineChart("auditChart", s.audit.per_day ?? [], getComputedStyle(document.body).getPropertyValue("--chart3"));
  barList("statusBars", s.sessions.by_status ?? [], "status", "var(--chart1)");
  barList("domainBars", s.events.by_domain ?? [], "domain", "var(--chart2)");
  barList("actionBars", s.audit.by_action ?? [], "action", "var(--chart3)");
  deviceTable(s.devices.devices ?? []);
}
refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
