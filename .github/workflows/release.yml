name: Release

# Tag-driven releases: push a v* tag and CI publishes the GitHub Release using
# the repo-scoped GITHUB_TOKEN — no personal tokens, no local account juggling.
# The APK is downloaded from the pinned URL in release/artifact.json and its
# sha256 is verified so the release ships exactly the build that was tested.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # marketplace-only publish of the extension from main

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build VS Code extension (.vsix)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter relay-by-bytical package
          mv extensions/vscode/*.vsix .

      - name: Build standalone controller (zero-dependency install)
        run: |
          pnpm --filter @rdc/desktop-controller exec node esbuild.mjs
          mkdir -p standalone
          cp apps/desktop-controller/dist/controller.mjs standalone/
          # pnpm doesn't hoist and some natives gate package.json behind exports —
          # resolve the module entry and walk up to its own package.json
          ver() { (cd "$1" && node -e "const fs=require('fs'),path=require('path');let d=path.dirname(require.resolve('$2'));while(fs.existsSync(path.join(d,'package.json'))===false)d=path.dirname(d);console.log(JSON.parse(fs.readFileSync(path.join(d,'package.json'),'utf8')).version)"); }
          PTY=$(ver packages/terminal @lydell/node-pty)
          WATCHER=$(ver apps/desktop-controller @parcel/watcher)
          KOFFI=$(ver apps/desktop-controller koffi)
          echo "pty=$PTY watcher=$WATCHER koffi=$KOFFI"
          cd standalone
          npm install --omit=dev --no-audit --no-fund --force \
            "@lydell/node-pty@${PTY}" "@parcel/watcher@${WATCHER}" "koffi@${KOFFI}"
          rm -f package.json package-lock.json
          cd ..
          tar -czf relay-controller-standalone.tgz -C standalone .
          ls -la relay-controller-standalone.tgz

      - name: Download and verify APK
        run: |
          python3 - <<'EOF'
          import json, pathlib
          spec = json.loads(pathlib.Path("release/artifact.json").read_text())
          tag = "${{ github.ref_name }}"
          if spec["tag"] != tag:
              raise SystemExit(f"artifact.json is for {spec['tag']}, not {tag} — update it before tagging")
          pathlib.Path("apk_url.txt").write_text(spec["apk_url"])
          EOF
          # expo.dev 403s non-browser UAs like python-urllib; curl passes
          curl -fsSL -o "relay-by-bytical-${{ github.ref_name }}.apk" "$(cat apk_url.txt)"
          # stable-named copy → evergreen releases/latest/download/relay-by-bytical.apk
          cp "relay-by-bytical-${{ github.ref_name }}.apk" relay-by-bytical.apk
          python3 - <<'EOF'
          import hashlib, json, pathlib
          spec = json.loads(pathlib.Path("release/artifact.json").read_text())
          out = pathlib.Path("relay-by-bytical-${{ github.ref_name }}.apk")
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          if digest != spec["sha256"]:
              raise SystemExit(f"sha256 mismatch: got {digest}, expected {spec['sha256']}")
          print(f"verified {out} ({out.stat().st_size} bytes, sha256 {digest})")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX=$(ls *.vsix)
          gh release create "${{ github.ref_name }}" \
            "relay-by-bytical.apk#Relay for Android — direct download (APK)" \
            "relay-by-bytical-${{ github.ref_name }}.apk#Relay for Android (versioned APK)" \
            "${VSIX}#Relay for VS Code (VSIX)" \
            "relay-controller-standalone.tgz#Relay controller — standalone (used by the extension)" \
            --title "Relay by Bytical — ${{ github.ref_name }}" \
            --notes-file release/notes.md

      # Auto-publish to the VS Code Marketplace when the VSCE_PAT secret is set
      # (Azure DevOps PAT, scope "Marketplace: Manage", all orgs). Skipped
      # silently otherwise so releases never block on Marketplace availability.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set — skipping Marketplace publish"
            exit 0
          fi
          cd extensions/vscode
          # idempotent: dispatch publishes may already have shipped this version
          pnpm exec vsce publish --no-dependencies --packagePath ../../relay-by-bytical-*.vsix -p "$VSCE_PAT" 2>&1 | tee publish.log || grep -q "already exists" publish.log

  # Manually triggered: republish just the extension (e.g. icon/metadata fix)
  publish-extension:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT not set"; exit 1; fi
          pnpm install --frozen-lockfile
          pnpm --filter relay-by-bytical package
          cd extensions/vscode
          # idempotent: reruns after a later-step failure must not die here
          pnpm exec vsce publish --no-dependencies --packagePath ./relay-by-bytical-*.vsix -p "$VSCE_PAT" 2>&1 | tee publish.log || grep -q "already exists" publish.log
      - name: Refresh standalone controller on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter @rdc/desktop-controller exec node esbuild.mjs
          mkdir -p standalone
          cp apps/desktop-controller/dist/controller.mjs standalone/
          # pnpm doesn't hoist and some natives gate package.json behind exports —
          # resolve the module entry and walk up to its own package.json
          ver() { (cd "$1" && node -e "const fs=require('fs'),path=require('path');let d=path.dirname(require.resolve('$2'));while(fs.existsSync(path.join(d,'package.json'))===false)d=path.dirname(d);console.log(JSON.parse(fs.readFileSync(path.join(d,'package.json'),'utf8')).version)"); }
          PTY=$(ver packages/terminal @lydell/node-pty)
          WATCHER=$(ver apps/desktop-controller @parcel/watcher)
          KOFFI=$(ver apps/desktop-controller koffi)
          echo "pty=$PTY watcher=$WATCHER koffi=$KOFFI"
          cd standalone
          npm install --omit=dev --no-audit --no-fund --force \
            "@lydell/node-pty@${PTY}" "@parcel/watcher@${WATCHER}" "koffi@${KOFFI}"
          rm -f package.json package-lock.json
          cd ..
          tar -czf relay-controller-standalone.tgz -C standalone .
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          gh release upload "$TAG" relay-controller-standalone.tgz --clobber
          echo "uploaded standalone to $TAG"