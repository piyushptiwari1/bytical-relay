packages:
  - packages/*
  - apps/*
  - extensions/*

# Expo SDK 57 native-compat pins: expo-modules-core C++ requires worklets 0.10.x
# (executeSync); transitive branches otherwise pull reanimated 4.6 + worklets 0.12.
overrides:
  react-native-reanimated: "4.5.1"
  react-native-worklets: "0.10.1"

catalog:
  typescript: ^5.9.2
  vitest: ^3.2.0
  fast-check: ^4.1.0
  zod: ^4.1.0
  uuid: ^11.1.0
  "@types/node": ^24.0.0
  fastify: ^5.0.0
  "@fastify/websocket": ^11.0.0
  pino: ^9.0.0
  commander: ^13.0.0
  execa: ^9.0.0
  ignore: ^7.0.0
  "@parcel/watcher": ^2.5.0
  tsx: ^4.19.0
  "@noble/curves": ^2.3.0
  "@noble/ciphers": ^2.3.0
  "@noble/hashes": ^2.3.0
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.5
  koffi: ^2.9.0
